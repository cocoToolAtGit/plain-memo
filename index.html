<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>プレーンメモ</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="メモ">
  <meta name="theme-color" content="#1a73e8">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    button:active { opacity: 0.7; }

    .btn-copy {
      background: #1a73e8;
      color: #fff;
    }
    .btn-copy.copied {
      background: #188038;
    }

    .btn-clear {
      background: #f1f3f4;
      color: #d93025;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
    }

    #editor {
      flex: 1;
      min-height: calc(100dvh - 120px);
      width: 100%;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 14px;
      font-family: "Menlo", "Monaco", "Courier New", monospace;
      font-size: 15px;
      line-height: 1.65;
      color: #222;
      resize: none;
      outline: none;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
    }
    #editor:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
    }
    #editor[data-placeholder]:empty::before {
      content: attr(data-placeholder);
      color: #aaa;
      pointer-events: none;
    }

    footer {
      text-align: right;
      font-size: 12px;
      color: #888;
      padding: 0 4px 4px;
    }

    @media (max-width: 480px) {
      header { padding: 10px 12px; }
      h1 { font-size: 14px; }
      button { padding: 7px 11px; font-size: 12px; }
      #editor { font-size: 14px; padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>プレーンメモ</h1>
    <div class="btn-group">
      <button class="btn-copy" id="btnCopy">全文コピー</button>
      <button class="btn-clear" id="btnClear">全消去</button>
    </div>
  </header>

  <main>
    <div
      id="editor"
      contenteditable="true"
      spellcheck="false"
      data-placeholder="ここにメモを入力、または貼り付け…"
    ></div>
    <footer><span id="charCount">0</span> 文字</footer>
  </main>

  <script>
    const STORAGE_KEY = 'plain-memo-v1';
    const editor = document.getElementById('editor');
    const charCount = document.getElementById('charCount');
    const btnCopy = document.getElementById('btnCopy');
    const btnClear = document.getElementById('btnClear');

    // --- 初期ロード ---
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      editor.textContent = saved;
    }
    updateCount();

    // --- テキスト取得 ---
    function getText() {
      return editor.innerText ?? editor.textContent ?? '';
    }

    // --- 文字数更新 ---
    function updateCount() {
      charCount.textContent = getText().replace(/\n$/, '').length;
    }

    // --- 自動保存 ---
    function save() {
      localStorage.setItem(STORAGE_KEY, getText());
      updateCount();
    }

    // --- 貼り付け: 書式剥ぎ取り ---
    editor.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      selection.deleteFromDocument();
      const range = selection.getRangeAt(0);
      const node = document.createTextNode(text);
      range.insertNode(node);
      range.setStartAfter(node);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      save();
    });

    // --- 入力監視 ---
    editor.addEventListener('input', save);

    // --- 全文コピー ---
    btnCopy.addEventListener('click', () => {
      const text = getText();
      navigator.clipboard.writeText(text).then(() => {
        btnCopy.textContent = 'コピー完了!';
        btnCopy.classList.add('copied');
        setTimeout(() => {
          btnCopy.textContent = '全文コピー';
          btnCopy.classList.remove('copied');
        }, 1800);
      }).catch(() => {
        // フォールバック
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        btnCopy.textContent = 'コピー完了!';
        btnCopy.classList.add('copied');
        setTimeout(() => {
          btnCopy.textContent = '全文コピー';
          btnCopy.classList.remove('copied');
        }, 1800);
      });
    });

    // --- 全消去 ---
    btnClear.addEventListener('click', () => {
      if (!getText().trim()) return;
      if (confirm('メモを全て消去しますか?')) {
        editor.textContent = '';
        save();
      }
    });
    // --- Service Worker 登録 ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
