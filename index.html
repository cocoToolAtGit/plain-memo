<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>プレーンメモ</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="メモ">
  <meta name="theme-color" content="#1a73e8">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    button:active { opacity: 0.7; }

    .btn-copy {
      background: #1a73e8;
      color: #fff;
    }
    .btn-copy.copied {
      background: #188038;
    }

    .btn-history {
      background: #f1f3f4;
      color: #555;
      position: relative;
    }

    .btn-copy-clear {
      background: #f1f3f4;
      color: #b06000;
    }
    .btn-copy-clear.done {
      background: #188038;
      color: #fff;
    }

    .btn-clear {
      background: #f1f3f4;
      color: #d93025;
    }

    /* 履歴パネル */
    #historyPanel {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      width: min(320px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 100;
      overflow: hidden;
    }
    #historyPanel.open { display: block; }

    .history-header {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      border-bottom: 1px solid #f0f0f0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .history-empty {
      padding: 20px 14px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }

    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
      transition: background 0.1s;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item:hover { background: #f8f9ff; }
    .history-item:active { background: #eef2ff; }

    .history-item-body {
      flex: 1;
      min-width: 0;
    }
    .history-item-date {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 3px;
    }
    .history-item-preview {
      font-size: 13px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: "Menlo", "Monaco", "Courier New", monospace;
    }
    .history-item-chars {
      font-size: 11px;
      color: #bbb;
      white-space: nowrap;
      padding-top: 2px;
    }

    /* オーバーレイ（パネルの外クリックで閉じる） */
    #historyOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99;
    }
    #historyOverlay.open { display: block; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
    }

    #editor {
      flex: 1;
      min-height: calc(100dvh - 120px);
      width: 100%;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 14px;
      font-family: "Menlo", "Monaco", "Courier New", monospace;
      font-size: 15px;
      line-height: 1.65;
      color: #222;
      resize: none;
      outline: none;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
    }
    #editor:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
    }
    #editor[data-placeholder]:empty::before {
      content: attr(data-placeholder);
      color: #aaa;
      pointer-events: none;
    }

    footer {
      text-align: right;
      font-size: 12px;
      color: #888;
      padding: 0 4px 4px;
    }

    @media (max-width: 480px) {
      header { padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); }
      h1 { font-size: 14px; }
      button { padding: 7px 11px; font-size: 12px; }
      #editor { font-size: 14px; padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>プレーンメモ</h1>
    <div class="btn-group">
      <button class="btn-copy" id="btnCopy">全文コピー</button>
      <button class="btn-copy-clear" id="btnCopyClear">コピーして消去</button>
      <div style="position:relative">
        <button class="btn-history" id="btnHistory">履歴</button>
        <div id="historyPanel">
          <div class="history-header">消去履歴（最大3件）</div>
          <div id="historyList"></div>
        </div>
      </div>
      <button class="btn-clear" id="btnClear">全消去</button>
    </div>
  </header>
  <div id="historyOverlay"></div>

  <main>
    <div
      id="editor"
      contenteditable="true"
      spellcheck="false"
      data-placeholder="ここにメモを入力、または貼り付け…"
    ></div>
    <footer><span id="charCount">0</span> 文字</footer>
  </main>

  <script>
    const STORAGE_KEY  = 'plain-memo-v1';
    const HISTORY_KEY  = 'plain-memo-history-v1';
    const MAX_HISTORY  = 3;

    const editor        = document.getElementById('editor');
    const charCount     = document.getElementById('charCount');
    const btnCopy       = document.getElementById('btnCopy');
    const btnCopyClear  = document.getElementById('btnCopyClear');
    const btnClear      = document.getElementById('btnClear');
    const btnHistory    = document.getElementById('btnHistory');
    const historyPanel  = document.getElementById('historyPanel');
    const historyList   = document.getElementById('historyList');
    const historyOverlay = document.getElementById('historyOverlay');

    // --- 初期ロード ---
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) editor.textContent = saved;
    updateCount();

    // --- テキスト取得 ---
    function getText() {
      return editor.innerText ?? editor.textContent ?? '';
    }

    // --- 文字数更新 ---
    function updateCount() {
      charCount.textContent = getText().replace(/\n$/, '').length;
    }

    // --- 自動保存 ---
    function save() {
      localStorage.setItem(STORAGE_KEY, getText());
      updateCount();
    }

    // --- 履歴の読み書き ---
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
      catch { return []; }
    }
    function saveHistory(hist) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    }
    function pushHistory(text) {
      const hist = loadHistory();
      hist.unshift({ text, date: new Date().toISOString() });
      saveHistory(hist.slice(0, MAX_HISTORY));
    }

    // --- 履歴パネル描画 ---
    function formatDate(iso) {
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function renderHistory() {
      const hist = loadHistory();
      if (!hist.length) {
        historyList.innerHTML = '<div class="history-empty">履歴はありません</div>';
        return;
      }
      historyList.innerHTML = hist.map((h, i) => {
        const preview = h.text.trim().replace(/\s+/g, ' ').slice(0, 60) || '（空のメモ）';
        const chars = h.text.replace(/\n$/, '').length;
        return `<div class="history-item" data-index="${i}">
          <div class="history-item-body">
            <div class="history-item-date">${formatDate(h.date)}</div>
            <div class="history-item-preview">${preview.replace(/</g,'&lt;')}</div>
          </div>
          <div class="history-item-chars">${chars}文字</div>
        </div>`;
      }).join('');

      historyList.querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', () => {
          const idx = Number(el.dataset.index);
          const hist = loadHistory();
          if (!hist[idx]) return;
          if (getText().trim()) {
            if (!confirm('現在のメモを消去して復元しますか?')) return;
            pushHistory(getText());
          }
          editor.textContent = hist[idx].text;
          save();
          closeHistory();
        });
      });
    }

    // --- 履歴パネル開閉 ---
    function openHistory() {
      renderHistory();
      historyPanel.classList.add('open');
      historyOverlay.classList.add('open');
    }
    function closeHistory() {
      historyPanel.classList.remove('open');
      historyOverlay.classList.remove('open');
    }

    btnHistory.addEventListener('click', () => {
      historyPanel.classList.contains('open') ? closeHistory() : openHistory();
    });
    historyOverlay.addEventListener('click', closeHistory);

    // --- 貼り付け: 書式剥ぎ取り ---
    editor.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      selection.deleteFromDocument();
      const range = selection.getRangeAt(0);
      const node = document.createTextNode(text);
      range.insertNode(node);
      range.setStartAfter(node);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      save();
    });

    // --- 入力監視 ---
    editor.addEventListener('input', save);

    // --- 全文コピー ---
    btnCopy.addEventListener('click', () => {
      const text = getText();
      const done = () => {
        btnCopy.textContent = 'コピー完了!';
        btnCopy.classList.add('copied');
        setTimeout(() => {
          btnCopy.textContent = '全文コピー';
          btnCopy.classList.remove('copied');
        }, 1800);
      };
      navigator.clipboard.writeText(text).then(done).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      });
    });

    // --- コピーして消去 ---
    btnCopyClear.addEventListener('click', () => {
      const text = getText();
      if (!text.trim()) return;
      const doClipboard = navigator.clipboard
        ? navigator.clipboard.writeText(text)
        : Promise.resolve().then(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          });
      doClipboard.then(() => {
        pushHistory(text);
        editor.textContent = '';
        save();
        btnCopyClear.textContent = 'コピー完了!';
        btnCopyClear.classList.add('done');
        setTimeout(() => {
          btnCopyClear.textContent = 'コピーして消去';
          btnCopyClear.classList.remove('done');
        }, 1800);
      });
    });

    // --- 全消去（履歴に保存してから消す）---
    btnClear.addEventListener('click', () => {
      const text = getText();
      if (!text.trim()) return;
      if (confirm('メモを全て消去しますか?')) {
        pushHistory(text);
        editor.textContent = '';
        save();
      }
    });

    // --- Service Worker 登録 ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
